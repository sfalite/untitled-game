<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0d171d">
  <title>Chaos City.io</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d171d; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
    #pixi-world { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: none; }
    #game { position: fixed; inset: 0; z-index: 1; background: transparent; }
    #pixi-toggle {
      position: fixed; top: 122px; left: 14px; z-index: 12; display: none;
      max-width: calc(100vw - 28px); min-height: 34px; padding: 8px 12px;
      border: 2px solid #45e6f2; border-radius: 9px;
      color: #e2fdff; background: #06454d;
      font: 800 11px/1.2 system-ui, sans-serif; letter-spacing: .25px;
      box-shadow: 0 4px 18px rgba(0,0,0,.48); cursor: pointer;
      touch-action: manipulation; pointer-events: auto;
    }
    #pixi-toggle.active { background: #006b75; border-color: #7df4ff; box-shadow: 0 0 0 2px rgba(69,230,242,.2), 0 4px 18px rgba(0,0,0,.48); }
    #pixi-toggle.error { background: #622b2b; border-color: #ff8e80; color: #ffe8e5; }
    @media (max-width: 500px) { #pixi-toggle { top: 121px; font-size: 10px; padding: 7px 9px; } }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Chaos City.io multiplayer game"></canvas>
  <button id="pixi-toggle" type="button" aria-pressed="false">ENABLE PIXIJS TEST</button>
  <!-- Relative path: modd.io serves this game inside its own sandboxed origin. -->
  <script type="module" src="main.js"></script>
</body>
</html>
